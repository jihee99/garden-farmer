<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하늘정원 목업</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
:root{--paper:#F7F2E9;--card:rgba(255,253,248,.82);--line:#E6DDCD;--ink:#35322D;--muted:#6E675C;--sky:#4F7299}
*{box-sizing:border-box}
body{margin:0;font-family:'Gowun Dodum',sans-serif;background:#E9E3D8;color:var(--ink)}
button,input{font:inherit}
.stage{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start;padding:48px 16px}
.frame{display:flex;flex-direction:column;gap:10px;align-items:center}
.frame-label{font-size:13px;color:var(--muted)}
.screen{position:relative;overflow:hidden;background:var(--paper);border-radius:36px;box-shadow:0 20px 50px rgba(60,50,40,.18)}
.phone{width:390px;height:844px}
.card9{width:360px;height:640px;border-radius:24px}
.wash{position:absolute;border-radius:50%;pointer-events:none}
.serif{font-family:'Gowun Batang',serif}
.petal{position:absolute;left:50%;top:50%;width:14px;height:19px;margin-left:-7px;margin-top:-19px;transform-origin:50% 100%;border-radius:50% 50% 46% 46%/64% 64% 36% 36%;box-shadow:inset 0 -5px 7px rgba(255,255,255,.45),inset 0 0 0 1px rgba(90,70,50,.06)}
.sm .petal{width:12px;height:17px;margin-left:-6px;margin-top:-17px}
.flower{position:relative;width:44px;height:44px}
.sm .flower{width:38px;height:38px}
.core{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%}
.stone-wrap{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.sm .stone-wrap{width:38px;height:38px}
.stone{width:20px;height:13px;border-radius:50%;background:#CBC3B5;box-shadow:inset -3px -3px 0 rgba(0,0,0,.06),inset 2px 2px 0 rgba(255,255,255,.5)}
.bud{width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px}
.leaf{width:9px;height:6px;background:#9DBB86}
.day{appearance:none;border:0;border-radius:14px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;background:transparent}
.day[aria-pressed="true"]{background:rgba(108,143,179,.16)}
.pill{appearance:none;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid #DCD2C1;background:rgba(255,253,248,.7);color:var(--ink);font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FAF6EE}
.pill small{font-size:12px;opacity:.75}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:56px;font-size:12px;color:var(--muted);text-decoration:none}
.opt{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 14px;border-radius:14px;background:rgba(255,253,248,.6);font-size:15px}
.opt input{width:20px;height:20px;accent-color:var(--sky)}
.stat{flex:1;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:16px;background:rgba(255,253,248,.7)}
.stat b{font-family:'Gowun Batang',serif;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="stage">

<section class="frame" aria-label="정원 홈">
<div class="frame-label">1 · 정원 홈 (탭·날짜 눌러보기)</div>
<div class="screen phone">
<div class="wash" style="left:-90px;top:-70px;width:300px;height:240px;background:#BCD6EC;filter:blur(46px);opacity:.6"></div>
<div class="wash" style="right:-100px;top:30px;width:260px;height:200px;background:#F2CBBE;filter:blur(50px);opacity:.5"></div>
<div style="position:relative;display:flex;flex-direction:column;gap:16px;padding:52px 20px 0">
<div style="display:flex;justify-content:space-between;align-items:flex-end">
<div style="display:flex;flex-direction:column;gap:4px">
<div style="font-size:13px;color:var(--muted);letter-spacing:.04em">2026 · 가을</div>
<h1 class="serif" style="margin:0;font-size:32px;font-weight:700">9월의 정원</h1>
<div style="font-size:14px;color:var(--muted)">이번 달 <span id="blooms"></span>송이가 피었어요</div>
</div>
<div id="avatars" style="display:flex;padding-bottom:4px"></div>
</div>
<div id="pills" style="display:flex;gap:8px"></div>
<div id="grid" style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px"></div>
<div style="display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:20px">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<div id="selTitle" class="serif" style="font-size:18px;font-weight:700"></div>
<div id="selSub" style="font-size:13px;color:var(--muted)"></div>
</div>
<div id="tiles" style="display:flex;gap:10px"></div>
<div id="selNote" style="font-size:13px;color:var(--muted)"></div>
</div>
</div>
<nav aria-label="메인 메뉴" style="position:absolute;left:0;right:0;bottom:0;height:92px;padding:0 36px 22px;display:flex;justify-content:space-between;align-items:center;background:rgba(247,242,233,.94);border-top:1px solid var(--line)">
<a class="tab" href="#garden" aria-current="page" style="color:var(--ink)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="3"/><path d="M12 12v9M12 17c-2-2-5-2-6-1M12 15c2-2 5-2 6-1"/></svg>정원</a>
<a class="tab" href="#sky" style="gap:6px;margin-top:-30px;color:var(--ink)"><span style="width:62px;height:62px;border-radius:50%;background:var(--sky);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(79,114,153,.35),inset 0 -8px 16px rgba(255,255,255,.18)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6-1.5A4 4 0 0 0 7 18z"/></svg></span>하늘 담기</a>
<a class="tab" href="#share"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6"/></svg>모아보기</a>
</nav>
</div>
</section>

<section class="frame" id="sky" aria-label="하늘 담기">
<div class="frame-label">2 · 하늘 담기</div>
<div class="screen phone" style="padding:52px 20px 28px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;justify-content:space-between;align-items:center">
<a href="#garden" style="display:flex;align-items:center;gap:4px;min-height:44px;font-size:15px;color:var(--ink);text-decoration:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>정원</a>
<div class="serif" style="font-size:18px;font-weight:700">지금, 하늘</div>
<div style="padding:6px 12px;border-radius:14px;background:#F2DCD2;color:#7A3E2C;font-size:13px">1:52 남음</div>
</div>
<div style="position:relative;height:330px;border-radius:28px;overflow:hidden;background:#C7DDEF;flex-shrink:0">
<div class="wash" style="left:-40px;top:-30px;width:280px;height:220px;background:#8FBCE2;filter:blur(34px);opacity:.85"></div>
<div class="wash" style="right:-60px;bottom:-40px;width:300px;height:200px;background:#F4CDBB;filter:blur(40px);opacity:.8"></div>
<div class="wash" style="left:70px;top:120px;width:160px;height:60px;background:#fff;filter:blur(14px);opacity:.85"></div>
<div class="wash" style="left:170px;top:96px;width:120px;height:56px;background:#fff;filter:blur(12px);opacity:.8"></div>
<div style="position:absolute;left:16px;bottom:14px;padding:6px 12px;border-radius:12px;background:rgba(255,253,248,.78);font-size:13px">오후 1:47 · 하늘 알림</div>
<button type="button" style="position:absolute;right:16px;bottom:14px;padding:6px 12px;border:0;border-radius:12px;background:rgba(255,253,248,.78);font-size:13px;color:var(--ink)">다시 찍기</button>
</div>
<div style="display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px">
<div style="width:40px;height:40px;border-radius:50%;background:#9CC3E4;box-shadow:inset 0 -6px 10px rgba(255,255,255,.45)"></div>
<div style="display:flex;flex-direction:column;gap:2px"><div style="font-size:15px">오늘의 하늘빛 · 맑은 물빛</div><div style="font-size:13px;color:var(--muted)">이 색으로 꽃잎이 칠해져요</div></div>
</div>
<fieldset style="margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:6px">
<legend style="padding:0 0 8px;font-size:14px;color:var(--muted)">어느 정원에 심을까요?</legend>
<label class="opt">나만의 정원<input type="checkbox" checked></label>
<label class="opt">우리 둘<input type="checkbox" checked></label>
<label class="opt">대학 동기 · 5명<input type="checkbox" checked></label>
</fieldset>
<label style="display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)">한 줄 남기기 (선택)
<input type="text" placeholder="점심 먹고 올려다본 하늘" style="height:46px;padding:0 14px;border-radius:14px;border:1px solid #DCD2C1;background:#FFFDF8;font-size:15px;color:var(--ink)">
</label>
<button type="button" style="margin-top:auto;height:54px;border:0;border-radius:27px;background:var(--sky);color:#fff;font-size:17px;cursor:pointer;box-shadow:0 6px 18px rgba(79,114,153,.3)">하늘 심기</button>
</div>
</section>

<section class="frame" id="share" aria-label="월말 공유 카드">
<div class="frame-label">3 · 월말 공유 카드 (9:16)</div>
<div class="screen card9 sm">
<div class="wash" style="left:-80px;top:-60px;width:280px;height:220px;background:#BCD6EC;filter:blur(46px);opacity:.65"></div>
<div class="wash" style="right:-90px;bottom:-40px;width:280px;height:220px;background:#F2CBBE;filter:blur(50px);opacity:.55"></div>
<div style="position:relative;height:100%;padding:40px 28px 32px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="font-size:13px;color:var(--muted);letter-spacing:.08em">하늘정원</div>
<div class="serif" style="font-size:40px;font-weight:700;line-height:1.1">2026. 09</div>
<div style="font-size:15px;color:#4A463F">대학 동기 다섯이 함께 피운 정원</div>
</div>
<div id="shareGrid" style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));row-gap:8px;padding:16px 8px;background:rgba(255,253,248,.6);border-radius:22px;justify-items:center"></div>
<div style="display:flex;gap:10px">
<div class="stat"><b id="sBlooms"></b><span>피어난 꽃</span></div>
<div class="stat"><b id="sFull"></b><span>다 함께 모인 날</span></div>
<div class="stat"><b id="sStones"></b><span>작은 돌멩이</span></div>
</div>
<div style="margin-top:auto;font-size:13px;color:var(--muted);text-align:center">같은 하늘 아래, 다른 자리에서</div>
</div>
</div>
</section>

</main>
<script>
var SKY=['#F2B8A2','#9CC3E4','#B7C2CC','#E9A9BD','#8494C6','#F2CE8C','#7FB5DD','#C7B2DE'];
var AV=['#BCD3E8','#F0C6B8','#CFDDBF','#DCC8E6','#F0DDAE'];
var GARDENS=[{label:'나만의 정원',members:['나']},{label:'우리 둘',members:['나','너']},{label:'대학 동기',members:['나','서연','민재','하은','도윤']}];
var TODAY=30;
function rnd(s){var x=Math.sin(s*12.9898+78.233)*43758.5453;return x-Math.floor(x);}
function build(gi){
  var n=GARDENS[gi].members.length,days=[],todayCount=n===1?0:(n===2?1:3);
  for(var d=1;d<=30;d++){
    var base=Math.floor(rnd(d*3.1+gi*0.7)*8),sk=[],cnt=0;
    for(var m=0;m<n;m++){
      var f=d===TODAY?m<todayCount:((d===9||d===22)?false:rnd(d*7.3+m*1.7+gi*11)>0.2);
      var c=SKY[(base+(rnd(d*5.7+m*2.3)>0.55?1:0))%8];
      sk.push(f?c:null);if(f)cnt++;
    }
    days.push({d:d,sk:sk,cnt:cnt,n:n});
  }
  return days;
}
/* 꽃 규칙: 1명 5장 같은 색 / 2명 6장 번갈아 / n명 n장. 빈 꽃잎은 점선. 0명이면 돌멩이(오늘은 새싹). 전원이면 금빛 가운데 */
function flowerHTML(r){
  if(r.cnt===0) return r.d===TODAY
    ? '<div class="bud"><div style="display:flex;gap:1px"><div class="leaf" style="border-radius:0 100% 0 100%"></div><div class="leaf" style="border-radius:100% 0 100% 0"></div></div><div style="width:2px;height:10px;background:#9DBB86"></div></div>'
    : '<div class="stone-wrap"><div class="stone"></div></div>';
  var n=r.n,pc=n===1?5:(n===2?6:n),h='<div class="flower">';
  for(var i=0;i<pc;i++){
    var o=n===1?0:(n===2?i%2:i),c=r.sk[o];
    h+='<div class="petal" style="transform:rotate('+Math.round(i*360/pc)+'deg);'+(c?'background:'+c+';opacity:.8;mix-blend-mode:multiply':'background:#FFFDF8;border:1px dashed #BFB4A2')+'"></div>';
  }
  var full=r.cnt===n;
  return h+'<div class="core" style="background:'+(full?'#E0A73E':'#A39884')+(full?';box-shadow:0 0 0 3px rgba(240,200,110,.4)':'')+'"></div></div>';
}
var state={gi:2,sel:TODAY};
function $(id){return document.getElementById(id);}
function render(){
  var G=GARDENS[state.gi],raw=build(state.gi),n=G.members.length;
  $('blooms').textContent=raw.filter(function(r){return r.cnt>0;}).length;
  $('avatars').innerHTML=G.members.map(function(m,i){return '<div style="width:30px;height:30px;margin-left:-8px;border-radius:50%;background:'+AV[i%5]+';border:2px solid #F7F2E9;display:flex;align-items:center;justify-content:center;font-size:12px;color:#2E2B27">'+m.charAt(0)+'</div>';}).join('');
  $('pills').innerHTML=GARDENS.map(function(g,i){return '<button type="button" class="pill" data-g="'+i+'" aria-pressed="'+(i===state.gi)+'">'+g.label+'<small>'+g.members.length+'명</small></button>';}).join('');
  $('grid').innerHTML=raw.map(function(r){
    return '<button type="button" class="day" data-d="'+r.d+'" aria-label="9월 '+r.d+'일" aria-pressed="'+(r.d===state.sel)+'">'+flowerHTML(r)+'<span style="font-size:11px;color:'+(r.d===TODAY?'#35322D;font-weight:700':'#6E675C')+'">'+r.d+'</span></button>';
  }).join('');
  var R=raw[state.sel-1];
  $('selTitle').textContent='9월 '+state.sel+'일'+(state.sel===TODAY?' · 오늘':'');
  $('selSub').textContent=n===1?(R.cnt?'하늘을 심었어요':'아직 하늘을 기다리는 중'):(n+'명 중 '+R.cnt+'명이 하늘을 올렸어요');
  $('selNote').textContent=R.cnt===n?'모두 모인 날이라 꽃 가운데가 반짝여요':(R.cnt===0?(state.sel===TODAY?'오늘 하늘이 모이면 꽃이 피어요':'아무도 없던 날엔 작은 돌멩이가 놓여요'):'비어 있는 꽃잎은 아직 하늘을 기다리는 자리예요');
  $('tiles').innerHTML=G.members.map(function(m,i){var c=R.sk[i];
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:48px">'+(c?'<div style="width:44px;height:44px;border-radius:14px;background:'+c+';opacity:.9;box-shadow:inset 0 -8px 14px rgba(255,255,255,.45)"></div>':'<div style="width:44px;height:44px;border-radius:14px;border:1.5px dashed #BFB4A2"></div>')+'<span style="font-size:12px;color:#6E675C">'+m+'</span></div>';}).join('');
}
function renderShare(){
  var raw=build(2);
  $('shareGrid').innerHTML=raw.map(flowerHTML).join('');
  $('sBlooms').textContent=raw.filter(function(r){return r.cnt>0;}).length;
  $('sFull').textContent=raw.filter(function(r){return r.cnt===r.n;}).length;
  $('sStones').textContent=raw.filter(function(r){return r.cnt===0&&r.d!==TODAY;}).length;
}
document.addEventListener('click',function(e){
  var p=e.target.closest('.pill');if(p){state.gi=+p.dataset.g;render();return;}
  var d=e.target.closest('.day');if(d){state.sel=+d.dataset.d;render();}
});
render();renderShare();
</script>
</body>
</html>
